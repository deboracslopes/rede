<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural Anônimo 💌</title>
  
  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    }

    body { 
      background-color: var(--bg-main); 
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 40px 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    }

    h1 { 
      margin-bottom: 24px; 
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Container para os botões do topo */
    .acoes-topo {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn-acao {
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.25);
    }

    .btn-acao:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.39);
    }
    .btn-acao:active { transform: translateY(0); }

    .btn-novo-post { background: linear-gradient(135deg, #4f46e5, #6366f1); }
    .btn-pesquisar { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }

    /* Containers dinâmicos */
    #form-container, #search-container {
      width: 100%;
      max-width: 480px;
      margin-bottom: 24px;
    }

    /* Estilo genérico dos cards de formulários */
    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease-out;
    }

    .form-card input, .form-card textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-card input:focus, .form-card textarea:focus {
      border-color: var(--primary);
    }

    .form-card textarea { resize: vertical; min-height: 90px; }

    .form-acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancelar {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-cancelar:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .btn-enviar {
      background: var(--success);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-enviar:hover { opacity: 0.9; }

    /* Feedback do Filtro Ativo */
    .filtro-ativo {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      font-weight: 600;
      color: #a5b4fc;
    }

    .btn-limpar-filtro {
      background: transparent;
      border: none;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #feed { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 480px; }

    /* Card da Postagem */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .emoji-box { 
      font-size: 2rem; 
      background: rgba(255, 255, 255, 0.05);
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .texto-box { 
      font-size: 1.05rem; 
      color: var(--text-main); 
      line-height: 1.5;
    }

    .hashtags-box { 
      color: #a5b4fc; 
      font-size: 0.85rem; 
      font-weight: 600; 
      letter-spacing: 0.02em;
    }

    .likes-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .btn-like {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-like:hover:not(:disabled) { 
      background: var(--danger); 
      color: white;
      transform: scale(1.05);
    }
    
    .btn-like:disabled {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-color: transparent;
      cursor: not-allowed;
    }

    .comentarios-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(15, 23, 42, 0.4);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .comentarios-box strong {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .lista-comentarios {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lista-comentarios li {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .form-comentario { display: flex; gap: 8px; margin-top: 4px; }
    .form-comentario input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }
    .form-comentario input:focus { border-color: var(--primary); }
    .form-comentario button {
      padding: 8px 14px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .form-comentario button:hover { background: var(--primary-hover); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>Mural Anônimo 💌</h1>
  
  <div class="acoes-topo">
    <button class="btn-acao btn-novo-post" onclick="toggleFormulario()">✨ Nova Postagem</button>
    <button class="btn-acao btn-pesquisar" onclick="togglePesquisa()">🔍 Pesquisar</button>
  </div>
  
  <div id="form-container"></div>
  <div id="search-container"></div>
  <div id="filtro-container"></div>

  <div id="feed">Carregando postagens...</div>

  <script>
    const SUPABASE_URL = "https://bnissagilpgfhicqigdk.supabase.co/"; 
    const SUPABASE_KEY = "sb_publishable_ixXgxiNlTtkio5pqK613mg_0eBmn23A";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const feedEl = document.getElementById("feed");
    const formContainerEl = document.getElementById("form-container");
    const searchContainerEl = document.getElementById("search-container");
    const filtroContainerEl = document.getElementById("filtro-container");

    let hashtagAtual = null;

    // --- MÉTODOS DE CONTROLE DO LOCALSTORAGE ---
    function getCurtidasLocais() {
      const curtidas = localStorage.getItem("curtidas_mural");
      return curtidas ? JSON.parse(curtidas) : [];
    }

    function salvarCurtidaLocal(id) {
      const curtidas = getCurtidasLocais();
      if (!curtidas.includes(id)) {
        curtidas.push(id);
        localStorage.setItem("curtidas_mural", JSON.stringify(curtidas));
      }
    }

    // Alterna o formulário de criação
    function toggleFormulario() {
      searchContainerEl.innerHTML = "";
      if (formContainerEl.innerHTML !== "") {
        formContainerEl.innerHTML = "";
        return;
      }

      formContainerEl.innerHTML = `
        <form class="form-card" onsubmit="criarPostagem(event)">
          <input type="text" id="input-emoji" placeholder="Emoji (ex: 😍, 🚀, 🤡)" maxlength="50" required />
          <textarea id="input-texto" placeholder="O que você está pensando?" required></textarea>
          <input type="text" id="input-hashtags" placeholder="Hashtags (ex: #dev #supabase)" />
          
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="toggleFormulario()">Cancelar</button>
            <button type="submit" class="btn-enviar">Publicar</button>
          </div>
        </form>
      `;
    }

    // Alterna o formulário de pesquisa
    function togglePesquisa() {
      formContainerEl.innerHTML = "";
      if (searchContainerEl.innerHTML !== "") {
        searchContainerEl.innerHTML = "";
        return;
      }

      searchContainerEl.innerHTML = `
        <form class="form-card" onsubmit="executarPesquisa(event)">
          <input type="text" id="input-busca-hashtag" placeholder="Digite a hashtag (ex: #dev)" required />
          <div class="form-acoes">
            <button type="button" class="btn-cancelar" onclick="togglePesquisa()">Cancelar</button>
            <button type="submit" class="btn-enviar" style="background:var(--accent);">Buscar</button>
          </div>
        </form>
      `;
    }

    // Executa o filtro de busca
    function executarPesquisa(event) {
      event.preventDefault();
      let term = document.getElementById("input-busca-hashtag").value.trim();
      
      if (!term.startsWith('#')) {
        term = '#' + term;
      }

      hashtagAtual = term;
      searchContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Limpa a busca e volta ao feed normal
    function limparFiltro() {
      hashtagAtual = null;
      filtroContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Envia o novo post para o Supabase
    async function criarPostagem(event) {
      event.preventDefault();

      const emoji = document.getElementById("input-emoji").value.trim();
      const texto = document.getElementById("input-texto").value.trim();
      const hashtagsRaw = document.getElementById("input-hashtags").value.trim();
      
      const hashtags = hashtagsRaw
        ? hashtagsRaw.split(" ")
            .filter(h => h.length > 0)
            .map(h => h.startsWith('#') ? h : '#' + h)
        : [];

      const { error } = await supabaseClient
        .from("postagens")
        .insert([{ emoji, texto, hashtags }]);

      if (error) {
        alert("Erro ao criar postagem!");
        console.error(error);
        return;
      }

      formContainerEl.innerHTML = "";
      carregarPostagens();
    }

    // Busca os posts no banco (com ou sem filtro)
    async function carregarPostagens() {
      let query = supabaseClient
        .from("postagens")
        .select("*")
        .order("created_at", { ascending: false });

      if (hashtagAtual) {
        query = query.contains("hashtags", [hashtagAtual]);
        
        filtroContainerEl.innerHTML = `
          <div class="filtro-ativo">
            <span>Filtrando por: ${hashtagAtual}</span>
            <button class="btn-limpar-filtro" onclick="limparFiltro()">Limpar ✖</button>
          </div>
        `;
      } else {
        filtroContainerEl.innerHTML = "";
      }

      const { data: postagens, error } = await query;

      if (error) {
        feedEl.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>Erro ao carregar postagens.</p>";
        console.error(error);
        return;
      }

      if (postagens.length === 0) {
        feedEl.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>Nenhuma postagem encontrada.</p>";
        return;
      }

      const curtidasLocais = getCurtidasLocais();

      feedEl.innerHTML = "";
      postagens.forEach(post => {
        const card = document.createElement("div");
        card.className = "card";

        const hashtagsTexto = post.hashtags ? post.hashtags.join(" ") : "";
        const listaComentariosHTML = (post.comentarios || [])
          .map(c => `<li>${c}</li>`)
          .join("");

        const jaCurtido = curtidasLocais.includes(post.id);

        card.innerHTML = `
          <div class="card-header">
            <div class="emoji-box">${post.emoji || '❤️'}</div>
            <div style="flex: 1;">
              <div class="texto-box">${post.texto}</div>
              ${hashtagsTexto ? `<div class="hashtags-box">${hashtagsTexto}</div>` : ''}
            </div>
          </div>
          
          <div class="likes-box">
            <span>❤️ ${post.likes || 0} Curtidas</span>
            <button 
              class="btn-like" 
              onclick="curtirPost(${post.id}, ${post.likes || 0})"
              ${jaCurtido ? 'disabled' : ''}
            >
              ${jaCurtido ? '❤️ Curtido' : '🤍 Curtir'}
            </button>
          </div>

          <div class="comentarios-box">
            <strong>Comentários</strong>
            <ul class="lista-comentarios">${listaComentariosHTML}</ul>
            <form class="form-comentario" onsubmit="adicionarComentario(event, ${post.id}, ${JSON.stringify(post.comentarios || []).replace(/"/g, '&quot;')})">
              <input type="text" placeholder="Escreva um comentário..." required />
              <button type="submit">Enviar</button>
            </form>
          </div>
        `;

        feedEl.appendChild(card);
      });
    }

    async function curtirPost(id, likesAtuais) {
      const curtidasLocais = getCurtidasLocais();
      if (curtidasLocais.includes(id)) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ likes: likesAtuais + 1 })
        .eq("id", id);

      if (!error) {
        salvarCurtidaLocal(id);
        carregarPostagens();
      }
    }

    async function adicionarComentario(event, id, comentariosAtuais) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const novoComentario = input.value.trim();

      if (!novoComentario) return;

      const { error } = await supabaseClient
        .from("postagens")
        .update({ comentarios: [...comentariosAtuais, novoComentario] })
        .eq("id", id);

      if (!error) carregarPostagens();
    }

    carregarPostagens();
  </script>
</body>
</html>
